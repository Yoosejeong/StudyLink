      region:
        static: ap-northeast-2
        auto: false
      credentials:
        access-key: sdf}
        secret-key: sdfefe
      s3:
        enabled: true
  ai:
    google:
      genai:
        api-key: test-key
app:
  s3:
    bucket: studylink-bucket
    presign:
      put-ttl: 10m
      get-ttl: 5m
cloud:
  aws:
    s3:
      enabled: false