
name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: resoreces 디렉토리 생성
      run: mkdir -p backend/src/main/resources

    - name: application.yml 생성
      run: echo "${{ secrets.APPLICATION_YML }}" > backend/src/main/resources/application.yml
      
    - name: application-dev.yml 생성
      run: echo "${{ secrets.APPLICATION_DEV_YML }}" > backend/src/main/resources/application-dev.yml
      

    - name: 테스트 및 빌드하기
      run: ./gradlew clean build

    - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-northeast-2
        
    - name: ECR에 로그인하기
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
        
    - name: Docker 이미지 생성
      run: docker build -t studylink .

    - name: Docker 이미지에 Tag 붙이기
      run: docker tag ${{ steps.login-ecr.outputs.registry }}/studylink:latest

    - name: ECR에 Docker 이미지 Push하기
      run: docker push ${{ steps.login-ecr.outputs.registry }}/studylink:latest

    - name: SSH로 EC2에 접속하기
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script_stop: true
        script: |
            REG="${{ steps.login-ecr.outputs.registry }}"
            APP="studylink"
            REPO="studylink-backend"                                   
            COMPOSE="/home/ubuntu/studylink-server/docker-compose.yml"

            # ECR 로그인 
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin "$REG"

            # 최신 이미지 당겨서 compose로 재기동
            docker compose -f "$COMPOSE" pull "$APP" --quiet
            docker compose -f "$COMPOSE" up -d --no-deps "$APP"

            docker image prune -f
