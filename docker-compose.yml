services:
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    restart: always
    container_name: studylink-redis
  studylink-backend:
    image: studylink-back:local
    ports:
      - 8080:8080
    depends_on:
      - redis
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studylink-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    env_file:
      - ./backend/.env.docker
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    container_name: prometheus
  grafana:
    image: "grafana/grafana:latest"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    container_name: grafana